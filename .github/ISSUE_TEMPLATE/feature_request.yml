name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - AlexRosbach
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in making BrainDumpApp better!
  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: |
        I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe any alternative solutions or features you've considered
      description: A clear and concise description of any alternative approaches you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request here.
  - type: checkboxes
    id: contribution
    attributes:
      label: Do you want to contribute to BrainDumpApp?
      options:
        - label: I would be willing to help implement this feature
