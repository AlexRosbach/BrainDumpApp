version: '3.8'

services:
  braindump:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - braindump_data:/data
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  braindump_data:
    driver: local
